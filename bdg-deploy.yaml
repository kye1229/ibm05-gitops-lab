apiVersion: apps/v1
kinde: Deployment
metadata:
  name: bgd
  namespace: vgd
  labels:
    app: bgd
spec:
  replica: 1
  selector:
    matchLabels:
      app: bgd
  template:
    metadata:
      labels:
        app: bgd    # 서비스의 label과 일치, metchLabels와 일치
      creationTimestamp: null
    spec:
      containers:
      - name: bgd
        image: quay.io/rhdevelopers/bgd:1.0.0
        env:
        - name: COLOR
          value: "blue"